<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>深夜便利店 · IAA 机制灰盒</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">单人 15 天项目 · 核心循环灰盒</p>
        <h1>深夜便利店</h1>
        <p class="subtitle">白天赚钱，夜里守门。你敢不敢多贪一排货架？</p>
      </div>
      <button id="soundToggle" class="icon-button" type="button" aria-label="切换音效">🔊</button>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div class="hud-card door-card">
        <span>卷帘门</span>
        <strong><b id="doorHp">100</b>%</strong>
        <div class="mini-bar"><i id="doorBar"></i></div>
      </div>
      <div class="hud-card">
        <span>现金</span>
        <strong>¥<b id="money">60</b></strong>
        <small>每秒 +<b id="income">1</b></small>
      </div>
      <div class="hud-card">
        <span>今晚</span>
        <strong><b id="timeLeft">90</b> 秒</strong>
        <small id="waveLabel">第一批异常顾客 10 秒后出现</small>
      </div>
    </section>

    <section id="coach" class="coach" aria-live="polite">
      <div class="coach-icon">☝️</div>
      <div><strong id="coachTitle">第一步：先建货架</strong><p id="coachText">点击下方“货架”，再点击店内发光格子。货架会自动赚钱。</p></div>
    </section>

    <section class="battle-card">
      <div class="road-head">
        <div><span class="live-dot"></span><strong>店外监控</strong></div>
        <div class="threat-chip">威胁 <b id="threat">低</b></div>
      </div>
      <canvas id="battleCanvas" width="900" height="420" aria-label="异常顾客正在接近便利店卷帘门"></canvas>
      <div class="door-strip">
        <span>🚪 卷帘门</span>
        <strong id="doorStatus">安全</strong>
        <button id="upgradeDoor" class="door-upgrade" type="button">加固门 ¥40</button>
      </div>
    </section>

    <section class="store-card">
      <div class="section-head">
        <div><h2>店内布局</h2><p>先选设施，再点空格建造；点击已有设施可升级。</p></div>
        <div id="comboBadge" class="combo-badge">尚未形成联动</div>
      </div>
      <div id="storeGrid" class="store-grid" aria-label="九格便利店布局"></div>
    </section>

    <section class="build-panel" aria-label="建造设施">
      <button class="build-card selected" data-build="shelf" type="button">
        <span class="build-icon">🛒</span><span><strong>货架</strong><small>¥20 · 每秒 +2</small></span><em>经济</em>
      </button>
      <button class="build-card" data-build="turret" type="button">
        <span class="build-icon">🔫</span><span><strong>自动炮台</strong><small>¥30 · 自动射击</small></span><em>输出</em>
      </button>
      <button class="build-card" data-build="freezer" type="button">
        <span class="build-icon">❄️</span><span><strong>冷柜</strong><small>¥35 · 周期减速</small></span><em>控制</em>
      </button>
      <button class="build-card" data-build="camera" type="button">
        <span class="build-icon">📹</span><span><strong>监控</strong><small>¥40 · 强化相邻设施</small></span><em>联动</em>
      </button>
    </section>

    <section class="rescue-row">
      <button id="emergencyButton" class="emergency-button" type="button">
        <span>⚡ 应急断电</span><strong>冻结全场 4 秒 · 本局 1 次</strong>
      </button>
      <button id="restartButton" class="secondary-button" type="button">重新开店</button>
    </section>

    <p id="statusLine" class="status-line" aria-live="polite">目标：撑过 90 秒。先滚经济，再在怪物撞门前完成防线。</p>
  </main>

  <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal-card">
      <p class="eyebrow">本局结束</p>
      <h2 id="resultTitle">便利店守住了</h2>
      <p id="resultText"></p>
      <div class="result-grid">
        <div><span>最高收入</span><strong id="resultIncome">0</strong></div>
        <div><span>击退怪物</span><strong id="resultKills">0</strong></div>
        <div><span>形成联动</span><strong id="resultCombos">0</strong></div>
      </div>
      <button id="resultRetry" class="primary-button" type="button">再开一局</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
